<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画ライブラリ</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ★★★ チーム設定エリア ★★★
   ============================================================ */
:root {
  /* 啓新高校サッカー部カラー：メイン=グレー、差し色=水色、ベース=黒 */
  --team-color: #4ec5e5;        /* 差し色の水色（アクセント／ボタン／ハイライト） */
  --team-color-dark: #2a8db0;   /* 水色の暗め */
  --team-gray: #6e7178;         /* メインのグレー（ロゴ背景・ヒーロー帯） */
  --team-gray-dark: #3a3c42;    /* グレーの暗め */

  --bg: #0a0a0c;                /* 黒ベース */
  --bg2: #131418;
  --bg3: #1c1e24;
  --bg-card: #16171c;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #ecedef;
  --text2: #9a9ba0;
  --text3: #5a5c63;
  --pdf-color: #e0533c;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; }
input { font-family: inherit; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--team-color) 10%, transparent), transparent),
    radial-gradient(ellipse 60% 40% at 90% 100%, color-mix(in srgb, var(--team-gray) 12%, transparent), transparent);
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   ログイン画面
   ============================================================ */
.login-screen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  padding: 24px;
}
.login-screen.hidden { display: none; }
.login-box {
  width: 100%; max-width: 380px;
  text-align: center;
  position: relative; z-index: 1;
}
.login-logo {
  width: 92px; height: 92px;
  margin: 0 auto 24px;
  border-radius: 20px;
  background: linear-gradient(145deg, var(--team-gray), var(--team-gray-dark));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px; font-weight: 700; color: #fff;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 12px 40px rgba(0,0,0,0.5),
    0 0 32px color-mix(in srgb, var(--team-color) 22%, transparent);
  overflow: hidden;
  position: relative;
}
.login-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  border: 1.5px solid color-mix(in srgb, var(--team-color) 55%, transparent);
  pointer-events: none;
}
.login-logo img { width: 100%; height: 100%; object-fit: cover; }
.login-team-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 30px; font-weight: 700; letter-spacing: 0.02em;
  margin-bottom: 4px;
}
.login-sub {
  font-size: 12px; color: var(--text3);
  letter-spacing: 0.18em; text-transform: uppercase;
  margin-bottom: 36px;
}
.login-field { position: relative; margin-bottom: 14px; }
.login-field input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 15px;
  padding: 15px 18px;
  border-radius: 11px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.login-field input:focus {
  border-color: var(--team-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--team-color) 18%, transparent);
}
.login-field input::placeholder { color: var(--text3); }
.login-btn {
  width: 100%;
  background: linear-gradient(145deg, var(--team-color), var(--team-color-dark));
  color: #fff;
  font-size: 15px; font-weight: 700;
  padding: 15px;
  border-radius: 11px;
  transition: transform 0.12s, filter 0.2s;
  margin-top: 6px;
}
.login-btn:hover { filter: brightness(1.1); }
.login-btn:active { transform: scale(0.98); }
.login-error {
  color: #ff6b6b; font-size: 13px;
  margin-top: 14px; min-height: 18px;
  opacity: 0; transition: opacity 0.2s;
}
.login-error.show { opacity: 1; }

/* ============================================================
   ヘッダー
   ============================================================ */
.app { position: relative; z-index: 1; display: none; }
.app.visible { display: block; }
header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  transition: padding 0.25s ease;
}
header.compact { padding: 8px 28px; }
header.compact .header-logo { width: 34px; height: 34px; font-size: 17px; border-radius: 9px; }
header.compact .header-team { font-size: 16px; }
header.compact .header-label { font-size: 9px; }
.header-left { display: flex; align-items: center; gap: 13px; }
.header-logo {
  width: 42px; height: 42px;
  border-radius: 11px;
  background: linear-gradient(145deg, var(--team-gray), var(--team-gray-dark));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 700; color: #fff;
  overflow: hidden; flex-shrink: 0;
  position: relative;
}
.header-logo::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 11px;
  border: 1px solid color-mix(in srgb, var(--team-color) 45%, transparent);
  pointer-events: none;
}
.header-logo img { width: 100%; height: 100%; object-fit: cover; }
.header-titles { display: flex; flex-direction: column; line-height: 1.25; }
.header-team {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 19px; font-weight: 700; letter-spacing: 0.01em;
}
.header-label {
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.16em; text-transform: uppercase;
}
.logout-btn {
  background: var(--bg3);
  color: var(--text2);
  font-size: 12px; font-weight: 500;
  padding: 9px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  transition: color 0.2s, border-color 0.2s;
}
.logout-btn:hover { color: var(--text); border-color: var(--border2); }

/* ============================================================
   ヒーロー
   ============================================================ */
.hero {
  padding: 46px 28px 34px;
  border-bottom: 1px solid var(--border);
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 500;
  color: var(--team-color);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-eyebrow::before {
  content: ''; width: 22px; height: 2px;
  background: var(--team-color); border-radius: 2px;
}
.hero h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 700; line-height: 1.1;
  letter-spacing: 0.01em;
  margin-bottom: 10px;
}
.hero p { font-size: 14px; color: var(--text2); max-width: 540px; }
.hero-stats { display: flex; gap: 28px; margin-top: 24px; }
.hero-stat-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 700;
  color: var(--team-color);
}
.hero-stat-label { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }

/* ============================================================
   コントロール（検索・フィルター）
   ============================================================ */
.controls {
  position: sticky; top: 71px; z-index: 90;
  padding: 14px 28px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  transition: padding 0.25s ease, top 0.25s ease;
}
/* スクロール時はさらにコンパクトに */
.controls.compact { padding: 8px 28px; top: 51px; }

/* 上段：検索バー＋種類フィルター＋絞り込みボタンを1行に */
.controls-top {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1 1 220px;
  max-width: 320px;
  min-width: 180px;
}
.search-wrap svg {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
}
#searchInput {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 14px;
  padding: 10px 16px 10px 42px;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s;
}
#searchInput:focus { border-color: var(--team-color); }
#searchInput::placeholder { color: var(--text3); }

/* 種類フィルター（インラインで配置） */
.type-inline {
  display: flex; gap: 6px;
  flex-wrap: wrap;
}

/* 絞り込みボタン（タグの開閉） */
.toggle-tags-btn {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg3);
  color: var(--text2);
  font-size: 12.5px; font-weight: 500;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  transition: all 0.15s;
  white-space: nowrap;
}
.toggle-tags-btn:hover { color: var(--text); border-color: var(--border2); }
.toggle-tags-btn.has-active {
  background: color-mix(in srgb, var(--team-color) 18%, var(--bg3));
  color: var(--team-color);
  border-color: var(--team-color);
}
.toggle-tags-btn .tag-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px;
  font-size: 10.5px; font-weight: 700;
  background: var(--team-color);
  color: #fff;
  border-radius: 9px;
  padding: 0 5px;
}
.toggle-tags-btn .arrow {
  transition: transform 0.2s;
}
.toggle-tags-btn.open .arrow { transform: rotate(180deg); }

/* タグエリア（折りたたみ） */
.tags-panel {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.3s ease, opacity 0.2s ease, margin-top 0.25s ease;
}
.tags-panel.open {
  max-height: 400px;
  opacity: 1;
  margin-top: 12px;
}
.filter-label {
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 7px;
}
.tags-panel .clear-tags {
  display: inline-flex; align-items: center; gap: 4px;
  background: transparent;
  color: var(--text3);
  font-size: 11.5px;
  padding: 4px 8px;
  margin-top: 8px;
  transition: color 0.2s;
}
.tags-panel .clear-tags:hover { color: var(--text2); }
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  background: var(--bg3);
  color: var(--text2);
  font-size: 12.5px; font-weight: 500;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  transition: all 0.15s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { color: var(--text); border-color: var(--border2); }
.chip.active {
  background: var(--team-color);
  color: #fff;
  border-color: var(--team-color);
}
.chip.tag.active {
  background: color-mix(in srgb, var(--team-color) 22%, var(--bg3));
  color: var(--team-color);
  border-color: var(--team-color);
}

/* ============================================================
   コンテンツ行（横スクロール）
   ============================================================ */
.rows-section { padding: 26px 0 10px; }
.result-count {
  font-size: 13px; color: var(--text3);
  margin: 0 28px 8px;
}
.result-count b { color: var(--text2); font-weight: 700; }

.content-row { margin-bottom: 30px; }
.row-head {
  display: flex; align-items: center; gap: 10px;
  padding: 0 28px;
  margin-bottom: 14px;
}
.row-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 700;
  letter-spacing: 0.01em;
}
.row-count {
  font-size: 11px; color: var(--text3);
  background: var(--bg3);
  padding: 2px 9px;
  border-radius: 10px;
}
.row-accent {
  width: 4px; height: 18px;
  border-radius: 2px;
  background: var(--team-color);
}

/* 横スクロールエリア */
.row-scroll-wrap { position: relative; }
.row-scroll {
  display: flex; gap: 16px;
  padding: 4px 28px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--bg3) transparent;
}
.row-scroll::-webkit-scrollbar { height: 8px; }
.row-scroll::-webkit-scrollbar-track { background: transparent; }
.row-scroll::-webkit-scrollbar-thumb {
  background: var(--bg3);
  border-radius: 4px;
}
.row-scroll::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* スクロール用の左右ボタン */
.scroll-btn {
  position: absolute; top: 0; bottom: 8px;
  width: 52px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to right, var(--bg) 35%, transparent);
  color: var(--text);
  z-index: 5;
  opacity: 0;
  transition: opacity 0.2s;
}
.scroll-btn.right {
  right: 0;
  background: linear-gradient(to left, var(--bg) 35%, transparent);
}
.scroll-btn.left { left: 0; }
.row-scroll-wrap:hover .scroll-btn { opacity: 1; }
.scroll-btn:disabled { opacity: 0 !important; pointer-events: none; }
.scroll-btn-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.scroll-btn:hover .scroll-btn-circle { background: var(--team-color); }

/* ============================================================
   カード
   ============================================================ */
.card {
  flex: 0 0 268px;
  width: 268px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  animation: cardIn 0.4s ease both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
.card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--team-color) 50%, var(--border2));
  box-shadow: 0 16px 36px rgba(0,0,0,0.45);
}

.card-thumb {
  position: relative;
  aspect-ratio: 16/9;
  background: var(--bg3);
  overflow: hidden;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
}
.card:hover .card-thumb img { transform: scale(1.05); }
.card-thumb-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  color: var(--text3);
}
.card-thumb-fallback.pdf {
  background: linear-gradient(135deg, color-mix(in srgb, var(--pdf-color) 16%, var(--bg3)), var(--bg2));
  color: color-mix(in srgb, var(--pdf-color) 70%, var(--text3));
}

/* 種類バッジ（動画 / PDF） */
.type-badge {
  position: absolute; left: 8px; top: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  color: #fff;
  letter-spacing: 0.02em;
}
.type-badge.video { background: var(--team-color); }
.type-badge.pdf { background: var(--pdf-color); }

.card-duration {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(0,0,0,0.82);
  color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px;
  border-radius: 5px;
}
.card-play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover .card-play { opacity: 1; }
.card-play-circle {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--team-color);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}
.card-play-circle.pdf { background: var(--pdf-color); }

.card-body { padding: 14px 15px 16px; }
.card-cat {
  font-size: 10px; font-weight: 600;
  color: var(--team-color);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.card-title {
  font-size: 15px; font-weight: 700;
  line-height: 1.4;
  margin-bottom: 5px;
}
.card-desc {
  font-size: 12.5px; color: var(--text2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 11px;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tag {
  font-size: 10.5px;
  color: var(--text3);
  background: var(--bg3);
  padding: 3px 8px;
  border-radius: 5px;
}

/* 空状態 */
.empty {
  text-align: center;
  padding: 70px 20px;
  color: var(--text3);
}
.empty svg { margin: 0 auto 16px; opacity: 0.5; }
.empty p { font-size: 14px; }

/* ============================================================
   モーダル
   ============================================================ */
.modal {
  position: fixed; inset: 0; z-index: 500;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  padding: 24px;
}
.modal.open { display: flex; }
.modal-box {
  width: 100%; max-width: 880px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 16px;
  overflow: hidden;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.modal-viewer {
  position: relative;
  background: #000;
  flex-shrink: 0;
}
.modal-viewer.video { aspect-ratio: 16/9; }
.modal-viewer.pdf { height: 70vh; }
.modal-viewer iframe {
  width: 100%; height: 100%; border: 0;
}
.modal-info { padding: 20px 22px 24px; overflow-y: auto; }
.modal-cat {
  font-size: 11px; font-weight: 600;
  color: var(--team-color);
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px; font-weight: 700;
  margin-bottom: 9px;
}
.modal-desc { font-size: 13.5px; color: var(--text2); margin-bottom: 14px; }
.modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.modal-tag {
  font-size: 11px; color: var(--text2);
  background: var(--bg3);
  padding: 4px 10px;
  border-radius: 6px;
}
.modal-openlink {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600;
  color: #fff;
  background: var(--pdf-color);
  padding: 9px 16px;
  border-radius: 9px;
  text-decoration: none;
}
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
  transition: background 0.2s;
}
.modal-close:hover { background: rgba(0,0,0,0.9); }

footer {
  padding: 28px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--text3);
  font-size: 11px;
  letter-spacing: 0.05em;
}

.loading {
  text-align: center;
  padding: 70px 20px;
  color: var(--text3);
  font-size: 13px;
}
.spinner {
  width: 30px; height: 30px;
  margin: 0 auto 16px;
  border: 3px solid var(--border2);
  border-top-color: var(--team-color);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  header { padding: 12px 16px; }
  header.compact { padding: 7px 16px; }
  .hero { padding: 32px 16px 26px; }
  .controls { padding: 12px 16px; top: 67px; }
  .controls.compact { padding: 7px 16px; }
  .controls-top { gap: 8px; }
  .search-wrap { flex: 1 1 100%; max-width: none; }
  .toggle-tags-btn { margin-left: 0; }
  .result-count { margin: 0 16px 8px; }
  .row-head { padding: 0 16px; }
  .row-scroll { padding: 4px 16px; }
  .scroll-btn { display: none; }
  .card { flex-basis: 230px; width: 230px; }
  .hero-stats { gap: 20px; }
  .modal-viewer.pdf { height: 60vh; }
}
</style>

/* ============================================================
   ↓↓↓ 以下はプログラム本体（編集不要） ↓↓↓
   ============================================================ */
let allItems = [];
let activeType = "all";       // all / video / pdf
let activeTags = new Set();
let searchText = "";

function init() {
  document.title = CONFIG.teamName + " | Training Library";
  document.getElementById('loginTeamName').textContent = CONFIG.teamName;

    render();

function setLogo(el) {
  if (CONFIG.logoImage) {
    el.innerHTML = '<img src="' + CONFIG.logoImage + '" alt="logo">';
  } else {
    el.textContent = CONFIG.logoText;
  }
}

// ---- ログイン ----
function tryLogin() {
  const input = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  if (input === CONFIG.password) {
    showApp();
  } else {
    errEl.classList.add('show');
    document.getElementById('passwordInput').value = '';
  }
}
function logout() {
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').classList.remove('show');
}
function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  loadData();
}

// ---- データ読み込み（JSONPでCORS回避） ----
async function loadData() {
  const container = document.getElementById('rowsContainer');
  container.innerHTML = '<div class="loading"><div class="spinner"></div>読み込んでいます...</div>';

  if (CONFIG.dataApiUrl) {
    try {
      allItems = await fetchViaJsonp(CONFIG.dataApiUrl);
    } catch (err) {
      console.error('データ取得エラー:', err);
      container.innerHTML = '<div class="empty"><p>データの読み込みに失敗しました</p></div>';
      allItems = [];
    }
  } else {
    allItems = SAMPLE_DATA;
  }

  // データの整形
  allItems.forEach(v => {
    if (typeof v.tags === 'string') {
      v.tags = v.tags.split(',').map(t => t.trim()).filter(Boolean);
    }
    if (!Array.isArray(v.tags)) v.tags = [];
    v.type = (v.type || 'video').toLowerCase();
    if (!v.url && v.videoUrl) v.url = v.videoUrl;
  });

  buildFilters();
  updateStats();
  render();
}

// JSONPでGASを呼び出す（CORS制限を回避）
function fetchViaJsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'jsonpCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const sep = url.includes('?') ? '&' : '?';
    const fullUrl = url + sep + 'callback=' + cbName;

    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('タイムアウト'));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('スクリプト読み込み失敗'));
    };
    script.src = fullUrl;
    document.body.appendChild(script);
  });
}

// ---- フィルターUI生成 ----
function buildFilters() {
  // 種類フィルター
  const typeBox = document.getElementById('typeChips');
  const types = [
    { key: 'all',   label: 'すべて',  icon: '' },
    { key: 'video', label: '動画',    icon: '▶' },
    { key: 'pdf',   label: 'PDF資料', icon: '📄' }
  ];
  typeBox.innerHTML = '';
  types.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (t.key === activeType ? ' active' : '');
    chip.textContent = (t.icon ? t.icon + ' ' : '') + t.label;
    chip.addEventListener('click', () => {
      activeType = t.key;
      buildFilters();
      render();
    });
    typeBox.appendChild(chip);
  });

  // タグフィルター
  const allTags = new Set();
  allItems.forEach(v => v.tags.forEach(t => allTags.add(t)));
  const tagBox = document.getElementById('tagChips');
  tagBox.innerHTML = '';
  [...allTags].sort().forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'chip tag' + (activeTags.has(tag) ? ' active' : '');
    chip.textContent = '#' + tag;
    chip.addEventListener('click', () => {
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      buildFilters();
      updateTagBadge();
      render();
    });
    tagBox.appendChild(chip);
  });
}

function updateStats() {
  document.getElementById('statVideo').textContent =
    allItems.filter(v => v.type === 'video').length;
  document.getElementById('statPdf').textContent =
    allItems.filter(v => v.type === 'pdf').length;
  document.getElementById('statCat').textContent =
    new Set(allItems.map(v => v.category).filter(Boolean)).size;
}

// 絞り込みボタンに、選択中タグ数のバッジを表示
function updateTagBadge() {
  const badge = document.getElementById('tagCountBadge');
  const btn = document.getElementById('toggleTagsBtn');
  const clearBtn = document.getElementById('clearTagsBtn');
  const n = activeTags.size;
  if (n > 0) {
    badge.textContent = n;
    badge.style.display = 'inline-flex';
    btn.classList.add('has-active');
    clearBtn.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
    btn.classList.remove('has-active');
    clearBtn.style.display = 'none';
  }
}

// ---- 絞り込み ----
function getFiltered() {
  return allItems.filter(v => {
    if (activeType !== "all" && v.type !== activeType) return false;
    if (activeTags.size > 0) {
      for (const t of activeTags) {
        if (!v.tags.includes(t)) return false;
      }
    }
    if (searchText) {
      const hay = (v.title + ' ' + (v.description || '') + ' ' + v.tags.join(' ')).toLowerCase();
      if (!hay.includes(searchText)) return false;
    }
    return true;
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ---- 描画（カテゴリごとに横スクロールの行） ----
function render() {
  const list = getFiltered();
  const container = document.getElementById('rowsContainer');
  document.getElementById('resultCount').innerHTML =
    '<b>' + list.length + '</b> 件';

  if (list.length === 0) {
    container.innerHTML =
      '<div class="empty">' +
      '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
      '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>' +
      '<p>該当するコンテンツが見つかりません</p></div>';
    return;
  }

  // カテゴリごとにグループ化
  const groups = {};
  const order = [];
  list.forEach(v => {
    const cat = v.category || 'その他';
    if (!groups[cat]) { groups[cat] = []; order.push(cat); }
    groups[cat].push(v);
  });

  container.innerHTML = '';
  order.forEach(cat => {
    container.appendChild(buildRow(cat, groups[cat]));
  });
}

// 1行分（カテゴリ行）を作る
function buildRow(catName, items) {
  const row = document.createElement('div');
  row.className = 'content-row';

  // 見出し
  const head = document.createElement('div');
  head.className = 'row-head';
  head.innerHTML =
    '<div class="row-accent"></div>' +
    '<div class="row-title">' + escapeHtml(catName) + '</div>' +
    '<div class="row-count">' + items.length + '</div>';
  row.appendChild(head);

  // スクロールエリア
  const wrap = document.createElement('div');
  wrap.className = 'row-scroll-wrap';

  const scroll = document.createElement('div');
  scroll.className = 'row-scroll';
  items.forEach((v, i) => scroll.appendChild(buildCard(v, i)));

  // 左右ボタン
  const leftBtn = makeScrollBtn('left', scroll);
  const rightBtn = makeScrollBtn('right', scroll);

  wrap.appendChild(leftBtn);
  wrap.appendChild(scroll);
  wrap.appendChild(rightBtn);
  row.appendChild(wrap);

  // ボタンの有効/無効をスクロール位置で切り替え
  const updateBtns = () => {
    leftBtn.disabled = scroll.scrollLeft <= 4;
    rightBtn.disabled =
      scroll.scrollLeft >= scroll.scrollWidth - scroll.clientWidth - 4;
  };
  scroll.addEventListener('scroll', updateBtns);
  setTimeout(updateBtns, 100);

  return row;
}

function makeScrollBtn(dir, scrollEl) {
  const btn = document.createElement('button');
  btn.className = 'scroll-btn ' + dir;
  const arrow = dir === 'left'
    ? '<path d="m15 18-6-6 6-6"/>'
    : '<path d="m9 18 6-6-6-6"/>';
  btn.innerHTML =
    '<div class="scroll-btn-circle">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
    arrow + '</svg></div>';
  btn.addEventListener('click', () => {
    const amount = scrollEl.clientWidth * 0.8;
    scrollEl.scrollBy({ left: dir === 'left' ? -amount : amount, behavior: 'smooth' });
  });
  return btn;
}

// カード1枚を作る
function buildCard(v, i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = (i * 0.04) + 's';

  const isPdf = v.type === 'pdf';

  const thumb = v.thumbnail
    ? '<img src="' + encodeURI(v.thumbnail) + '" alt="" onerror="this.style.display=\'none\'">'
    : '';

  const fallbackIcon = isPdf
    ? '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>'
    : '<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>';
  const fallback =
    '<div class="card-thumb-fallback' + (isPdf ? ' pdf' : '') + '">' +
    '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
    fallbackIcon + '</svg></div>';

  const badge = isPdf
    ? '<span class="type-badge pdf">📄 PDF</span>'
    : '<span class="type-badge video">▶ 動画</span>';

  const playIcon = isPdf
    ? '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="#fff" stroke-width="2"/><path d="M14 2v6h6" fill="none" stroke="#fff" stroke-width="2"/>'
    : '<path d="M8 5v14l11-7z"/>';

  const tags = v.tags.slice(0, 3).map(t =>
    '<span class="card-tag">#' + escapeHtml(t) + '</span>').join('');

  card.innerHTML =
    '<div class="card-thumb">' +
      fallback + thumb +
      badge +
      (v.duration ? '<span class="card-duration">' + escapeHtml(v.duration) + '</span>' : '') +
      '<div class="card-play"><div class="card-play-circle' + (isPdf ? ' pdf' : '') + '">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="' + (isPdf ? 'none' : '#fff') + '">' +
      playIcon + '</svg></div></div>' +
    '</div>' +
    '<div class="card-body">' +
      (v.category ? '<div class="card-cat">' + escapeHtml(v.category) + '</div>' : '') +
      '<div class="card-title">' + escapeHtml(v.title) + '</div>' +
      (v.description ? '<div class="card-desc">' + escapeHtml(v.description) + '</div>' : '') +
      '<div class="card-tags">' + tags + '</div>' +
    '</div>';

  card.addEventListener('click', () => openModal(v));
  return card;
}

// ---- モーダル ----
function openModal(v) {
  const isPdf = v.type === 'pdf';
  document.getElementById('modalCat').textContent = v.category || '';
  document.getElementById('modalTitle').textContent = v.title;
  document.getElementById('modalDesc').textContent = v.description || '';
  document.getElementById('modalTags').innerHTML =
    v.tags.map(t => '<span class="modal-tag">#' + escapeHtml(t) + '</span>').join('');

  const viewer = document.getElementById('modalViewer');
  viewer.className = 'modal-viewer ' + (isPdf ? 'pdf' : 'video');
  document.getElementById('modalIframe').src = toEmbedUrl(v.url);

  // PDFのときは「別タブで開く」リンクを出す
  const openWrap = document.getElementById('modalOpenWrap');
  if (isPdf) {
    openWrap.innerHTML =
      '<a class="modal-openlink" href="' + encodeURI(v.url) + '" target="_blank" rel="noopener">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>' +
      'PDFを別タブで開く</a>';
  } else {
    openWrap.innerHTML = '';
  }

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalIframe').src = '';
}

// Google DriveのURLを埋め込み表示用に変換（動画・PDF共通）
function toEmbedUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^/]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return url;
}

init();
</script>
